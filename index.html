<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Gestión completa de tu negocio de alfajores artesanales" />
  <meta name="theme-color" content="#ffcc00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alfajores" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <title>Alfajores Maite ❤️🍫</title>
  <!-- Aplica el tema guardado antes de pintar: si no, arranca oscuro y parpadea. -->
  <script>
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('alfmgr_theme') || 'dark');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-icon">🍫</span>
      <div>
        <span class="logo-title">Alfajores Maite❤️</span>
        <span class="logo-sub">Mi negocio</span>
      </div>
    </div>
    <button class="sidebar-close" id="sidebarClose" aria-label="Cerrar menú">✕</button>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item active" data-module="dashboard" href="#dashboard">
      <span class="nav-icon">🏠</span><span class="nav-label">Inicio</span>
    </a>

    <span class="nav-group">Producción</span>
    <a class="nav-item" data-module="inventario" href="#inventario">
      <span class="nav-icon">📦</span><span class="nav-label">Inventario</span>
    </a>
    <a class="nav-item" data-module="recetas" href="#recetas">
      <span class="nav-icon">📋</span><span class="nav-label">Recetas</span>
    </a>
    <a class="nav-item" data-module="produccion" href="#produccion">
      <span class="nav-icon">👩‍🍳</span><span class="nav-label">Producción</span>
    </a>
    <a class="nav-item" data-module="costos" href="#costos">
      <span class="nav-icon">💰</span><span class="nav-label">Costos</span>
    </a>

    <span class="nav-group">Ventas</span>
    <a class="nav-item" data-module="pedidos" href="#pedidos">
      <span class="nav-icon">🎁</span><span class="nav-label">Pedidos</span>
      <span class="nav-badge" id="badgePedidos" hidden></span>
    </a>
    <a class="nav-item" data-module="ventas" href="#ventas">
      <span class="nav-icon">🛒</span><span class="nav-label">Ventas</span>
    </a>
    <a class="nav-item" data-module="clientes" href="#clientes">
      <span class="nav-icon">👥</span><span class="nav-label">Clientes</span>
    </a>
    <a class="nav-item" data-module="caja" href="#caja">
      <span class="nav-icon">💵</span><span class="nav-label">Caja</span>
    </a>

    <span class="nav-group">Análisis</span>
    <a class="nav-item" data-module="estadisticas" href="#estadisticas">
      <span class="nav-icon">📈</span><span class="nav-label">Estadísticas</span>
    </a>
    <a class="nav-item" data-module="metas" href="#metas">
      <span class="nav-icon">🎯</span><span class="nav-label">Metas</span>
    </a>
    <a class="nav-item" data-module="reportes" href="#reportes">
      <span class="nav-icon">📄</span><span class="nav-label">Reportes</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
      <span id="themeIcon">☀️</span> <span id="themeLabel">Modo Claro</span>
    </button>
  </div>
</aside>

<!-- ===== OVERLAY ===== -->
<div class="overlay" id="overlay"></div>

<!-- ===== MAIN ===== -->
<main class="main-content" id="mainContent">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
    <h1 class="page-title" id="pageTitle">Dashboard</h1>
    <div class="topbar-right">
      <span class="date-badge" id="dateBadge"></span>
      <button class="install-btn" id="installBtn" style="display:none">📲 Instalar</button>
    </div>
  </header>

  <!-- Módulos -->
  <div id="moduleContainer" class="module-container">
    <!-- Se carga dinámicamente -->
  </div>
</main>

<!-- ===== MODAL GLOBAL ===== -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle"></h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/inventario.js"></script>
<script src="js/recetas.js"></script>
<script src="js/produccion.js"></script>
<script src="js/clientes.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/ventas.js"></script>
<script src="js/estadisticas.js"></script>
<script src="js/reportes.js"></script>
</body>
</html>
